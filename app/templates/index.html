<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditWise - Loan Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 800px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-top: 50px;
        }
        h1 { 
            color: #333; 
            text-align: center; 
            font-size: 2.5rem;
        }
        .subtitle { 
            text-align: center; 
            color: #666; 
            margin-bottom: 30px; 
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            font-weight: 600; 
            color: #555; 
        }
        .btn-predict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .btn-predict:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result-card {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            display: none;
        }
        .result-approved {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        .result-rejected {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
        .result-error {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }
        .probability-bar {
            width: 100%;
            background: #e9ecef;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-top: 10px;
        }
        .probability-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 1s;
            border-radius: 10px;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 CreditWise</h1>
        <p class="subtitle">Intelligent Loan Prediction System</p>
        
        <form id="predictionForm">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Applicant Income ($)</label>
                        <input type="number" class="form-control" id="applicant_income" required value="5000">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Co-applicant Income ($)</label>
                        <input type="number" class="form-control" id="coapplicant_income" required value="2000">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Loan Amount ($)</label>
                        <input type="number" class="form-control" id="loan_amount" required value="150">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Loan Term (months)</label>
                        <input type="number" class="form-control" id="loan_term" required value="360">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Credit History</label>
                <select class="form-control" id="credit_history" required>
                    <option value="1">1 - Good Credit</option>
                    <option value="0">0 - Bad Credit</option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Gender</label>
                        <select class="form-control" id="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Married</label>
                        <select class="form-control" id="married" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Dependents</label>
                        <select class="form-control" id="dependents" required>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3+">3+</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Education</label>
                        <select class="form-control" id="education" required>
                            <option value="Graduate">Graduate</option>
                            <option value="Not Graduate">Not Graduate</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Self Employed</label>
                        <select class="form-control" id="self_employed" required>
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Property Area</label>
                <select class="form-control" id="property_area" required>
                    <option value="Urban">Urban</option>
                    <option value="Semiurban">Semi-Urban</option>
                    <option value="Rural">Rural</option>
                </select>
            </div>
            
            <button type="submit" class="btn-predict" id="predictBtn">🔮 Predict Loan Approval</button>
            
            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p class="mt-2">Processing your application...</p>
            </div>
        </form>

        <div id="result" class="result-card">
            <h3 id="resultTitle"></h3>
            <p id="resultMessage"></p>
            <div class="probability-bar">
                <div id="probabilityFill" class="probability-fill" style="width: 0%"></div>
            </div>
            <p id="probabilityText" class="mt-2"></p>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('predictBtn').disabled = true;
            document.getElementById('result').style.display = 'none';
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams(data)
                });
                
                const result = await response.json();
                
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('predictBtn').disabled = false;
                
                const resultDiv = document.getElementById('result');
                const title = document.getElementById('resultTitle');
                const message = document.getElementById('resultMessage');
                const probabilityFill = document.getElementById('probabilityFill');
                const probabilityText = document.getElementById('probabilityText');
                
                resultDiv.style.display = 'block';
                resultDiv.className = 'result-card';
                
                // Check if there was an error
                if (result.error) {
                    resultDiv.classList.add('result-error');
                    title.textContent = '⚠️ Error';
                    message.textContent = result.error;
                    probabilityFill.style.width = '0%';
                    probabilityText.textContent = 'Unable to calculate probability';
                    return;
                }
                
                // Handle NaN probability
                if (isNaN(result.probability) || result.probability === null) {
                    resultDiv.classList.add('result-error');
                    title.textContent = '⚠️ Prediction Issue';
                    message.textContent = 'There was an issue calculating the probability. Please try again.';
                    probabilityFill.style.width = '0%';
                    probabilityText.textContent = 'Probability unavailable';
                    return;
                }
                
                if (result.prediction === 1) {
                    resultDiv.classList.add('result-approved');
                    title.textContent = '✅ Loan Approved!';
                    message.textContent = 'Congratulations! Your loan application is likely to be approved based on the provided information.';
                } else {
                    resultDiv.classList.add('result-rejected');
                    title.textContent = '❌ Loan Rejected';
                    message.textContent = 'Unfortunately, your loan application is likely to be rejected. Consider improving your credit score or applying with a co-applicant.';
                }
                
                const probPercent = (result.probability * 100).toFixed(1);
                probabilityFill.style.width = probPercent + '%';
                probabilityText.textContent = `Approval Probability: ${probPercent}%`;
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('predictBtn').disabled = false;
                
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.className = 'result-card result-error';
                document.getElementById('resultTitle').textContent = '❌ Error';
                document.getElementById('resultMessage').textContent = 'An error occurred while making the prediction. Please try again.';
                document.getElementById('probabilityFill').style.width = '0%';
                document.getElementById('probabilityText').textContent = '';
                
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
